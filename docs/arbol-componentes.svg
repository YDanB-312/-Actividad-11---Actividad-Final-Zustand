<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #111111; stroke-width: 1.4; }
      .root { fill: #111111; stroke: #111111; stroke-width: 1.4; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .title-light { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; fill: #ffffff; }
      .sub { font-family: Consolas, monospace; font-size: 11px; fill: #555555; }
      .sub-light { font-family: Consolas, monospace; font-size: 11px; fill: #dddddd; }
      .line { stroke: #111111; stroke-width: 1.2; fill: none; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #555555; }
    </style>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- App -->
  <rect class="root" x="380" y="20" width="240" height="52"/>
  <text class="title-light" x="396" y="43">App.jsx</text>
  <text class="sub-light" x="396" y="59">Navbar · Routes · CartPanel</text>

  <!-- Conectores nivel 1 -->
  <path class="line" d="M500 72 V90"/>
  <path class="line" d="M170 90 H830"/>
  <path class="line" d="M170 90 V110"/>
  <path class="line" d="M500 90 V110"/>
  <path class="line" d="M830 90 V110"/>

  <!-- Nivel 1 -->
  <rect class="box" x="60" y="110" width="220" height="50"/>
  <text class="title" x="74" y="132">Navbar</text>
  <text class="sub" x="74" y="148">cart · auth · ui</text>

  <rect class="box" x="390" y="110" width="220" height="50"/>
  <text class="title" x="404" y="132">Routes</text>
  <text class="sub" x="404" y="148">React Router</text>

  <rect class="box" x="720" y="110" width="220" height="50"/>
  <text class="title" x="734" y="132">CartPanel</text>
  <text class="sub" x="734" y="148">cart · ui</text>

  <!-- Conectores a rutas -->
  <path class="line" d="M500 160 V180"/>
  <path class="line" d="M175 180 H745"/>
  <path class="line" d="M175 180 V200"/>
  <path class="line" d="M365 180 V200"/>
  <path class="line" d="M555 180 V200"/>
  <path class="line" d="M745 180 V200"/>

  <!-- Rutas -->
  <rect class="box" x="90" y="200" width="170" height="50"/>
  <text class="title" x="104" y="222">Catalog</text>
  <text class="sub" x="104" y="238">product</text>

  <rect class="box" x="280" y="200" width="170" height="50"/>
  <text class="title" x="294" y="222">Favorites</text>
  <text class="sub" x="294" y="238">favorites · ProductCard</text>

  <rect class="box" x="470" y="200" width="170" height="50"/>
  <text class="title" x="484" y="222">Login</text>
  <text class="sub" x="484" y="238">auth</text>

  <rect class="box" x="660" y="200" width="170" height="50"/>
  <text class="title" x="674" y="222">Profile</text>
  <text class="sub" x="674" y="238">ProtectedRoute</text>

  <!-- Conectores Catalog -->
  <path class="line" d="M175 250 V270"/>
  <path class="line" d="M105 270 H435"/>
  <path class="line" d="M105 270 V290"/>
  <path class="line" d="M270 270 V290"/>
  <path class="line" d="M435 270 V290"/>

  <!-- Hijos de Catalog -->
  <rect class="box" x="30" y="290" width="150" height="50"/>
  <text class="title" x="44" y="312">CatalogFilters</text>
  <text class="sub" x="44" y="328">search · category</text>

  <rect class="box" x="195" y="290" width="150" height="50"/>
  <text class="title" x="209" y="312">CatalogGrid</text>
  <text class="sub" x="209" y="328">useShallow</text>

  <rect class="box" x="360" y="290" width="150" height="50"/>
  <text class="title" x="374" y="312">Counter</text>
  <text class="sub" x="374" y="328">counter</text>

  <!-- ProductCard -->
  <path class="line" d="M270 340 V380"/>
  <rect class="box" x="195" y="380" width="150" height="50"/>
  <text class="title" x="209" y="402">ProductCard</text>
  <text class="sub" x="209" y="418">cart · favorites</text>

  <!-- Nota -->
  <path class="line" d="M30 470 H970" stroke-dasharray="3 3"/>
  <text class="note" x="30" y="495">
    Los stores no son componentes: las etiquetas indican qué hook usa cada componente.
  </text>
  <text class="note" x="30" y="512">
    ProductCard no recibe el carrito ni los favoritos por props: los lee directamente del store.
  </text>
  <text class="note" x="30" y="529">
    Ruta * redirige a /; /perfil está dentro de ProtectedRoute y exige token.
  </text>
</svg>
